{% extends 'mailingserv/base.html' %}
{% block content %}
<h2>Редактировать профиль пользователя</h2>
<div class="card-body">
    <form method="POST" action="" class="form-floating" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">
            Сохранить
        </button>
        <div class="btn-group me-2">
          <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'users:user_profile' %}" role="button">Назад</a>
        </div>
    </form>
</div>
{% endblock %}
