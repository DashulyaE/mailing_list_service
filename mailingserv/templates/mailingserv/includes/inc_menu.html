<div class="container">
  <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
    <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
      <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
        <use xlink:href="#bootstrap"></use>
      </svg>
    </a>
    <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
      <li><a href="{% url 'mailingserv:home' %}" class="nav-link px-2 text-secondary">Главная</a></li>
      {% if user.is_authenticated %}
        <li><a href="{% url 'mailingserv:mailing_list' %}" class="nav-link px-2 text-white">Рассылки</a></li>
        <li><a href="{% url 'mailingserv:message_list' %}" class="nav-link px-2 text-white">Сообщения</a></li>
        <li><a href="{% url 'mailingserv:client_list' %}" class="nav-link px-2 text-white">Получатели</a></li>
        <li><a href="#" class="nav-link px-2 text-white">Отчеты по рассылке</a></li>
        <li><a href="{% url 'mailingserv:all_attempts' %}" class="nav-link px-2 text-white">Попытки рассылки</a></li>
      {% endif %}
    </ul>
    <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
      <input type="search" class="form-control form-control-dark text-bg-dark" placeholder="Search..." aria-label="Search"> </form>
    <div class="text-end">
        {% if user.is_authenticated %}
          <form method="post" action="{% url 'users:logout' %}" style="display: inline">
              {% csrf_token %}
              <button type="submit" class="p-2 btn btn-outline-danger">Выйти</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light me-2" href="{% url 'users:register' %}">Регистрация</a>
          <a class="btn btn-warning" href="{% url 'users:login' %}">Войти</a>
        {% endif %}
    </div>
  </div>
</div>
