{% extends 'mailingserv/base.html' %}
{% block content %}
<div class="card mb-4 box-shadow">
    <div class="card-body">
        <form method="POST" action="" class="form-floating" enctype="multipart/form-data">
            <p class="card-text mb-auto">Действительно хотите удалить сообщение номер{{ object.id }}?</p>
            {% csrf_token %}
            <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Удалить</button>
            <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'mailingserv:message_list' %}" role="button">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
