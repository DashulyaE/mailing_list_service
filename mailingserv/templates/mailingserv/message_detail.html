{% extends 'mailingserv/base.html' %}
{% block content %}
<h2>Сообщение</h2>
<div class="table-responsive small">
  <table class="table table-striped table-sm">
    <tbody>
      <tr>
        <td><strong>Тема письма</strong></td>
        <td>{{ object.subject }}</td>
      </tr>
      <tr>
        <td><strong>Текст письма</strong></td>
        <td>{{ object.body }}</td>
      </tr>
      <tr>
        <td>
          <div class="btn-group me-2">
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'mailingserv:message_list' %}" role="button">Назад</a>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
{% endblock %}
