{% extends 'mailingserv/base.html' %}
{% block content %}
<div class="card mb-4 box-shadow">
    <div class="card-header">
        <h4 class="my-0 font-weight-normal">
            {% if object %}
            Редактируйте сообщение
            {% else %}
            Создайте сообщение
            {% endif %}
        </h4>
    </div>
    <div class="card-body">
        <form method="POST" action="" class="form-floating" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button type="submit" class="btn btn-lg btn-block btn-outline-primary">
                {% if object %}
                Сохранить
                {% else %}
                Создать
                {% endif %}
            </button>
            <div class="btn-group me-2">
              <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'mailingserv:message_list' %}" role="button">Назад</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
