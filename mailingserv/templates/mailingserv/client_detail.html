{% extends 'mailingserv/base.html' %}
{% block content %}
<h2>Получатель</h2>
<div class="table-responsive small">
  <table class="table table-striped table-sm">
    <tbody>
      <tr>
        <td><strong>E-mail получателя</strong></td>
        <td>{{ object.email }}</td>
      </tr>
      <tr>
        <td><strong>ФИО получателя</strong></td>
        <td>{{ object.full_name }}</td>
      </tr>
      <tr>
        <td><strong>Комментарий</strong></td>
        <td>{{ object.comment }}</td>
      </tr>
      <tr>
        <td><div class="btn-group me-2">
          <a class="btn btn-sm btn-outline-secondary" href="{% url 'mailingserv:client_list' %}" role="button">Назад</a>
        </div></td>
      </tr>
    </tbody>
  </table>
</div>
{% endblock %}
